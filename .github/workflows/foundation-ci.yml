name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm:
    name: JVM (io + storage-engine)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test existing JVM modules
        run: ./gradlew :io:jvmTest :storage-engine:jvmTest --console=plain
      - name: Save failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-jvm-test-reports
          path: |
            io/build/reports/tests/
            storage-engine/build/reports/tests/
          if-no-files-found: ignore

  linux-native:
    name: Linux x64 Native (io + storage-engine)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile IO and test storage on Linux Native
        run: ./gradlew :io:compileKotlinLinuxX64 :storage-engine:compileTestKotlinLinuxX64 :storage-engine:linuxX64Test --console=plain
      - name: Save failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-linux-test-reports
          path: storage-engine/build/reports/tests/
          if-no-files-found: ignore

  macos-native:
    name: macOS ARM64 Native (io + storage-engine)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile IO and test storage on macOS ARM64
        run: ./gradlew :io:compileKotlinMacosArm64 :storage-engine:compileTestKotlinMacosArm64 :storage-engine:macosArm64Test --console=plain
      - name: Save failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-macos-test-reports
          path: storage-engine/build/reports/tests/
          if-no-files-found: ignore
